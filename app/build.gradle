plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.google.services)
    alias(libs.plugins.firebase.crashlytics)
}

android {
    namespace 'com.contacts.manager.ai.smartdialer.voicemessages.calling.callapp'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.contacts.manager.ai.smartdialer.voicemessages.calling.callapp"
        minSdk 25
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Override in gradle.properties / -P: contactsApiBaseUrl, admobAppId
        buildConfigField "String", "API_BASE_URL", "\"${project.findProperty('contactsApiBaseUrl') ?: 'https://contacts.anthemknight.tech/'}\""
        manifestPlaceholders = [admobAppId: project.findProperty('admobAppId') ?: 'ca-app-pub-3940256099942544~3347511713']
    }

    androidResources {
        generateLocaleConfig = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.core
    implementation libs.lifecycle.viewmodel
    implementation libs.lifecycle.livedata
    implementation libs.recyclerview
    implementation libs.core.splashscreen
    implementation libs.glide
    implementation libs.browser
    implementation libs.play.review
    implementation libs.work.runtime
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.analytics
    implementation libs.firebase.crashlytics
    implementation libs.firebase.messaging
    implementation libs.lifecycle.process
    implementation libs.play.services.ads
    implementation libs.install.referrer
    implementation libs.facebook.core
    implementation libs.audience.network
    implementation libs.tradplus
    implementation libs.tradplus.google
    implementation libs.tradplus.facebook
    testImplementation libs.junit
    testImplementation libs.json
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
